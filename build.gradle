buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:3.6.4'
    }
}

// Accept Android SDK licenses so AGP can auto-install missing SDK components.
// The 24333f8a hash is the current Android SDK license signature required by
// modern cmdline-tools; older hashes kept for compatibility.
def sdkDir = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
if (sdkDir != null) {
    try {
        def licensesDir = new File(sdkDir, "licenses")
        licensesDir.mkdirs()
        new File(licensesDir, "android-sdk-license").text = "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd975f751698a77b662f1254ddbeed3901e943f1e"
        new File(licensesDir, "android-sdk-preview-license").text = "\n84831b9409646a918e30573bab4c9c9137d47a98"
    } catch (ignored) {
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Diagnostics: on failure, surface the real Gradle error as GitHub annotations
gradle.buildFinished { result ->
    if (result.failure == null) {
        return
    }
    try {
        def f = result.failure
        int n = 0
        def c = f
        while (c != null && n < 5) {
            def line = (c.getClass().getName() + ": " + c.getMessage())
            line = line.replaceAll("[\\r\\n%]", " ")
            if (line.length() > 190) {
                line = line.substring(0, 190)
            }
            println "::error::" + line
            n++
            c = c.getCause()
        }
    } catch (ignored) {
    }
}
