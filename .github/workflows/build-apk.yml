name: Build APK

on:
  push:
    branches:
      - main
      - build-apk
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '5.6.4'
      - name: Accept Android SDK licenses
        run:      - name: Accept Android SDK licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c9137d47a98" > $ANDROID_HOME/licenses/android-sdk-preview-license

      - name: Install Android SDK 28
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-28" "build-tools;28.0.3" > /dev/null
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppleTVLauncher-4.4-apk
          path: app/build/outputs/apk/debug/app-debug.apk
