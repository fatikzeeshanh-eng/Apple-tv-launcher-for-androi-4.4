name: Build APK

on:
  push:
    branches: [ main, build-apk ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

- name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

- name: Set up Gradle 5.6.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '5.6.4'

- name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

- name: Install Android SDK 28
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-28" "build-tools;28.0.3" > /dev/null

- name: Build debug APK
        run: gradle assembleDebug --no-daemon

- name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppleTVLauncher-4.4-apk
          path: app/build/outputs/apk/debug/app-debug.apk
